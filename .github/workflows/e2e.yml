name: End-to-end tests (manual)

# The Playwright suite cannot pass in CI yet: nothing starts the API, the app
# or a database, and the specs predate the login screen. It last passed before
# January 2026. Issue #81 tracks rebuilding it; until then this workflow only
# runs when started by hand so it does not report a failure on every pull request.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright
    # Playwright 1.57 does not support the image that ubuntu-latest now points to.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30
